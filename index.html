<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 호랭이 자료실</title><meta name="description" content="릴스에서 본 프롬프트와 설치법을 바로 복사하세요.">
<meta property="og:title" content="AI 호랭이 자료실"><meta property="og:description" content="릴스에서 본 프롬프트와 설치법을 바로 복사하세요.">
<link rel="icon" href="img/tiger.jpg"><style>
@font-face{font-family:SC;src:url(fonts/S-CoreDream-5Medium.woff);font-weight:500;font-display:swap}
@font-face{font-family:SC;src:url(fonts/S-CoreDream-9Black.woff);font-weight:900;font-display:swap}
:root{--bg:#F9F7F3;--dot:#E2DED6;--ink:#111;--grey:#6B665F;--or:#FF6A1A;--cream:#FDDEAF;--paper:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 16px/1.65 SC,"Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg) radial-gradient(circle,var(--dot) 1.2px,transparent 1.6px) 0 0/22px 22px;word-break:keep-all;overflow-wrap:anywhere}
.w{max-width:960px;margin:0 auto;padding:20px 16px 64px}
button,input,a{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{display:flex;align-items:center;gap:12px}header img{width:56px;height:56px;border:3px solid var(--ink);border-radius:50%}
header b{font-weight:900;font-size:19px;flex:1}header b a{text-decoration:none}
.ig{border:3px solid var(--ink);background:var(--paper);padding:7px 14px;text-decoration:none;border-radius:30px;font-weight:900;font-size:14px}
h1{font-weight:900;font-size:clamp(28px,7.4vw,46px);line-height:1.25;margin:26px 0 18px}h1 em{font-style:normal;background:var(--or);color:#fff;padding:0 8px}
#q{width:100%;border:3px solid var(--ink);background:var(--paper);padding:13px 16px;box-shadow:5px 5px 0 var(--ink);border-radius:0}
#tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}#tabs button{border:3px solid var(--ink);background:var(--paper);padding:6px 15px;font-weight:900;font-size:14px;border-radius:30px}#tabs [aria-pressed=true]{background:var(--or);color:#fff}
#g{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 16px}@media(min-width:700px){#g{grid-template-columns:repeat(4,1fr)}}
.c{border:3px solid var(--ink);background:var(--paper);box-shadow:5px 5px 0 var(--ink);text-decoration:none;display:flex;flex-direction:column;position:relative}
.c img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;border-bottom:3px solid var(--ink)}.c span{padding:10px 11px 12px;font-weight:900;font-size:15px;line-height:1.4}
.c small{position:absolute;left:8px;top:8px;background:var(--cream);border:2px solid var(--ink);padding:0 8px;font-weight:900;font-size:12px}
.back{display:inline-block;margin:24px 0 8px;font-weight:900;text-decoration:none;padding:6px 0}h2{font-weight:900;font-size:clamp(24px,6vw,36px);line-height:1.3;margin-bottom:20px}
.b{border:3px solid var(--ink);background:var(--paper);margin-bottom:18px}.b.k{box-shadow:5px 5px 0 var(--ink)}
.h{display:flex;align-items:center;gap:10px;padding:9px 14px;font-weight:900;border-bottom:3px solid var(--ink);background:#fff}.k .h{background:var(--cream)}.h span{flex:1}
.cp{border:3px solid var(--ink);background:var(--or);color:#fff;padding:6px 16px;font-weight:900;min-width:78px}.cp.ok{background:var(--ink)}
.t{padding:14px;white-space:pre-wrap;user-select:text}.n{grid-column:1/-1;padding:40px 0;text-align:center;color:var(--grey)}
footer{margin-top:44px;color:var(--grey);font-size:14px}
</style></head><body><div class="w"><header><img src="img/tiger.jpg" alt=""><b><a href="#">AI 호랭이 자료실</a></b><a class="ig" href="https://www.instagram.com/ai_beom/">@ai_beom</a></header><main id="m"></main><footer>하루 12시간 AI 쓰는 호랭이가 바로 써볼 프롬프트를 계속 올려요.</footer></div>
<script src="data.js"></script><script>
const today=new Date(Date.now()+9*36e5).toISOString().slice(0,10),D=DATA.filter(x=>x.date<'2099').sort((a,b)=>{const g=x=>['20','25','24','21','12','06','05','16'].includes(x.id)?2:x.id=='03'?1:0;if(g(a)!=g(b))return g(a)-g(b);const p=a.date<=today,q=b.date<=today;return p!=q?(p?-1:1):p?(b.date.localeCompare(a.date)||b.id-a.id):a.date.localeCompare(b.date)}),m=document.getElementById('m');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lk=s=>esc(s).replace(/(https?:\/\/[^\s)<]+)|((?<![\w@\/.-])(?:[a-z0-9-]+\.)+(?:com|ai|dev|org|new|google|io)(?:\/[\w.\/-]*)?)/g,(u)=>u.endsWith('.')?u:`<a href="${u.startsWith('http')?u:'https://'+u}" target="_blank" rel="noopener">${u}</a>`);
let tag='전체',q='';
function cards(){const L=D.filter(x=>(tag=='전체'||x.tag==tag)&&(x.title+x.kw+x.b.map(b=>b.h+b.t).join(' ')).toLowerCase().includes(q.toLowerCase().trim()));
document.getElementById('g').innerHTML=L.map(x=>`<a class="c" href="#${x.id}"><img loading="lazy" src="img/${x.id}.jpg" alt=""><small>${x.tag}</small><span>${esc(x.title)}</span></a>`).join('')||'<p class="n">찾는 자료가 없어요. 다른 말로 검색해 보세요.</p>'}
function home(){m.innerHTML=`<h1>릴스에서 본 그거,<br><em>바로 복사</em>하세요</h1><input id="q" type="search" aria-label="자료 검색" placeholder="찾는 자료 이름 (예: 마을, 밤샘)"><div id="tabs"></div><div id="g"></div>`;
const i=document.getElementById('q');i.value=q;i.oninput=()=>{q=i.value;cards()};const t=document.getElementById('tabs');
['전체','프롬프트','클로드','도구'].forEach(n=>{const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-pressed',n==tag);b.onclick=()=>{tag=n;[...t.children].forEach(c=>c.setAttribute('aria-pressed',c==b));cards()};t.append(b)});cards()}
async function copy(b,s){let ok=0;try{await navigator.clipboard.writeText(s);ok=1}catch(e){const a=document.createElement('textarea');a.value=s;a.style.cssText='position:fixed;top:0;opacity:0';document.body.append(a);a.select();a.setSelectionRange(0,s.length);try{ok=document.execCommand('copy')}catch(e){}a.remove()}
b.textContent=ok?'복사됨':'길게 눌러 복사';b.classList.toggle('ok',!!ok);setTimeout(()=>{b.textContent='복사';b.classList.remove('ok')},1800)}
function item(x){m.innerHTML=`<a class="back" href="#">← 전체 자료</a><h2>${esc(x.title)}</h2>`+x.b.map((b,i)=>`<section class="b ${b.c?'k':''}">${b.h||b.c?`<div class="h"><span>${esc(b.h)}</span>${b.c?`<button class="cp" data-i="${i}">복사</button>`:''}</div>`:''}<div class="t">${b.c?esc(b.t):lk(b.t)}</div></section>`).join('');
m.querySelectorAll('.cp').forEach(b=>b.onclick=()=>copy(b,x.b[b.dataset.i].t))}
function go(){const x=D.find(d=>d.id==location.hash.slice(1));x?item(x):home();document.title=(x?x.title+' · ':'')+'AI 호랭이 자료실';scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script></body></html>
